<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tune!</title>
    <meta property="og:title" content="Tune!" />
    <meta property="og:description" content="Listen along on Tune!, a free music player for Windows." />
    <meta property="og:image" content="https://tunetheapp.co.uk/img/icon.png" />
    <meta name="theme-color" content="#ff2e88" />
    <link rel="icon" href="/img/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/style.css?v=13" />
    <link rel="stylesheet" href="/cosmetics.css?v=2" />
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <a class="brand" href="/"><img src="/img/icon.png" alt="" />Tune!</a>
        <nav>
          <a class="hide-sm" href="/#features">Features</a>
          <span data-account></span>
          <a class="btn small" href="/">Get Tune!</a>
        </nav>
      </header>

      <main class="card-page">
        <div id="out"><div class="spinner" aria-label="Loading"></div></div>
      </main>
    </div>

    <script>
      // GitHub Pages has no routing, so every unknown path lands here. Two of them are real:
      //   /join/ABC123   a Listening Party invite
      //   /u/handle      someone's profile
      const SUPABASE = "https://dhawbwlaiypaddpnjaav.supabase.co";
      const KEY = "sb_publishable_j261GWZGiPVW8MXbR-1nXQ_Q0VWXuym"; // the public key; reads only what's meant to be public
      const out = document.getElementById("out");
      const path = decodeURIComponent(location.pathname).replace(/\/+$/, "");

      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      const pic = (p) => (p ? `${SUPABASE}/storage/v1/object/public/avatars/${p.split("/").map(encodeURIComponent).join("/")}` : null);
      const initial = (s) => esc((s || "?").trim().charAt(0).toUpperCase());
      async function rpc(name, body) {
        const r = await fetch(`${SUPABASE}/rest/v1/rpc/${name}`, {
          method: "POST",
          headers: { apikey: KEY, "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!r.ok) throw new Error(r.status);
        return (await r.json())[0] ?? null;
      }
      /** Tries tune:// and, if Tune! isn't installed (the page is still showing), says so. */
      function openInApp(link) {
        location.href = link;
        setTimeout(() => {
          if (document.hasFocus()) document.getElementById("hint").textContent = "Nothing happened? Download Tune! first, then try the button again.";
        }, 1600);
      }
      function show(html, title) {
        out.innerHTML = html;
        if (title) document.title = `${title} · Tune!`;
      }
      function notFound(what) {
        show(
          `<div class="card"><div class="body no-banner">
             <h1>${what}</h1>
             <p class="bio">Check the link and try again.</p>
             <div class="actions"><a class="btn" href="/">Go to Tune!</a></div>
           </div></div>`,
          "Not found",
        );
      }

      async function party(code) {
        const p = await rpc("party_preview", { invite: code }).catch(() => null);
        if (!p) return notFound("That party doesn't exist");
        const host = p.host_name || "@" + p.host_handle;
        const av = pic(p.host_avatar);
        show(
          `<div class="card"><div class="body no-banner">
             <div class="avatar">${av ? `<img src="${av}" alt="">` : initial(host)}</div>
             <span class="pill-tag ${p.open ? "" : "off"}">${p.open ? "Listening Party" : "This party has ended"}</span>
             <h1>${esc(host)} invited you</h1>
             <p class="handle">@${esc(p.host_handle)}${p.open ? ` · ${p.members} listening` : ""}</p>
             <div class="code" aria-label="Party code">${esc(p.code)}</div>
             <div class="actions">
               ${p.open ? `<button class="btn" id="go">Join in Tune!</button>` : ""}
               <a class="btn ghost" href="/">Download Tune!</a>
             </div>
             <p class="hint" id="hint">${p.open ? "Or open Tune!, go to Party and type the code." : "Ask them to start a new one."}</p>
           </div></div>`,
          `Join ${host}'s party`,
        );
        document.getElementById("go")?.addEventListener("click", () => openInApp(`tune://join/${p.code}`));
        // Straight into Tune! if it's installed (the browser may ask first); the button stays for a second try.
        if (p.open) openInApp(`tune://join/${p.code}`);
      }

      // Links to other profiles: only these sites, each in its exact shape (the database checks
      // the same), so a profile can't link anywhere else.
      const cut = 'fill="var(--midnight)" stroke="none"';
      const SITES = [
        ["spotify", "Spotify", "#1ed760", /^https:\/\/open\.spotify\.com\/(user|artist)\/[A-Za-z0-9._-]{1,64}$/, '<circle cx="12" cy="12" r="10" fill="currentColor" stroke="none"/><path d="M6.8 9.4c3.6-1.1 7.6-.8 10.6.9M7.4 12.6c3-.8 6.2-.5 8.6.9M8 15.6c2.4-.6 4.7-.3 6.6.8" stroke="var(--midnight)" stroke-width="1.7"/>'],
        ["soundcloud", "SoundCloud", "#ff5500", /^https:\/\/soundcloud\.com\/[A-Za-z0-9_-]{1,40}$/, '<path d="M10 17V9.2a5 5 0 0 1 9.4 2.3h.4a2.8 2.8 0 0 1 0 5.5z" fill="currentColor" stroke="none"/><path d="M7.5 17v-6M5 17v-4.5M2.5 17v-2.5"/>'],
        ["applemusic", "Apple Music", "#fa2d48", /^https:\/\/music\.apple\.com\/[A-Za-z0-9\/_%.-]{1,150}$/, '<path d="M9 18.5V6.5l11-2.2v11.4"/><circle cx="6.5" cy="18.5" r="2.5" fill="currentColor" stroke="none"/><circle cx="17.5" cy="16" r="2.5" fill="currentColor" stroke="none"/>'],
        ["youtube", "YouTube", "#ff0033", /^https:\/\/youtube\.com\/@[A-Za-z0-9._-]{3,30}$/, `<rect x="2" y="5" width="20" height="14" rx="4.5" fill="currentColor" stroke="none"/><path d="M10 9.2v5.6l4.8-2.8z" ${cut}/>`],
        ["instagram", "Instagram", "#e1306c", /^https:\/\/instagram\.com\/[A-Za-z0-9._]{1,30}$/, '<rect x="3" y="3" width="18" height="18" rx="5.2"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"/>'],
        ["x", "X", "#e7e9ea", /^https:\/\/x\.com\/[A-Za-z0-9_]{1,15}$/, '<path d="M4 4l16 16M20 4L4 20" stroke-width="2.3"/>'],
        ["tiktok", "TikTok", "#25f4ee", /^https:\/\/tiktok\.com\/@[A-Za-z0-9._]{2,24}$/, '<path d="M14 3v11.5a4 4 0 1 1-4-4" stroke-width="2.4"/><path d="M14 3c.4 2.6 2.2 4.4 5 4.6" stroke-width="2.4"/>'],
        ["twitch", "Twitch", "#a970ff", /^https:\/\/twitch\.tv\/[A-Za-z0-9_]{3,25}$/, '<path d="M4.5 3h16v11l-4.5 4.5h-4L8.5 22v-3.5h-4z"/><path d="M11 7.5v4.5M15.5 7.5v4.5"/>'],
      ];
      function linksHtml(links) {
        if (!links || typeof links !== "object") return "";
        const items = SITES.filter(([id, , , ok]) => typeof links[id] === "string" && ok.test(links[id])).map(([id, name, color, , svg]) => {
          const url = links[id];
          const last = url.split("/").filter(Boolean).at(-1);
          const label = id === "spotify" || id === "applemusic" ? name : id === "instagram" || id === "x" ? "@" + last : last;
          return `<a class="site" style="--b:${color}" href="${esc(url)}" target="_blank" rel="noopener noreferrer nofollow ugc" title="${esc(name)}"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${svg}</svg><span>${esc(label)}</span></a>`;
        });
        return items.length ? `<div class="sites">${items.join("")}</div>` : "";
      }
      // Cosmetics earned in the app: a ring around the picture, an effect on the banner, a name
      // style and up to three badges. Only known ones are drawn.
      const RINGS = ["glow", "pulse", "duo", "spin", "orbit", "rainbow", "fire", "gold"];
      const BANNER_FX = ["shimmer", "eq", "stars", "aurora", "embers", "waves", "confetti"];
      const NAME_FX = ["gradient", "glow", "shine"];
      const ICON = (d) => `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
      const FLAME = ICON('<path d="M12 21c-3.9 0-6.5-2.6-6.5-6.2 0-2.6 1.4-4.6 3.1-6.2.3 1.6 1.1 2.7 2.2 3.3-.2-3.4 1.2-6.1 3.7-8.4.4 2.9 1.7 4.6 3.1 6.2 1.3 1.5 1.9 3.1 1.9 5.1 0 3.6-2.6 6.2-6.5 6.2z"/>');
      const BADGE_INFO = {
        streak: [FLAME, "Streak"],
        listener: [ICON('<path d="M4.5 15.5V12a7.5 7.5 0 0 1 15 0v3.5"/><rect x="3.5" y="14" width="4" height="6.5" rx="1.6"/><rect x="16.5" y="14" width="4" height="6.5" rx="1.6"/>'), "Listener"],
        party: [ICON('<circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19.5a5.5 5.5 0 0 1 11 0"/><path d="M15.5 5.6a3.2 3.2 0 0 1 0 5.8M17.5 14.4a5.5 5.5 0 0 1 3 5.1"/>'), "Party"],
        creator: [ICON('<path d="M19.5 4.5 11 13"/><path d="M9.5 12.5c-2.2 0-3.5 1.5-3.5 3.4 0 1.5-.7 2.6-2.5 3.1 3.9 1.3 8.2.2 8.4-3.6z"/>'), "Creator"],
      };
      const TIER_NAMES = ["Bronze", "Silver", "Gold", "Diamond"];
      const TIER_COLOURS = ["#d08a4c", "#cfd6e4", "#ffcf4a", "#9ff3ff"];
      function fxOf(u) {
        const c = u.cosmetics && typeof u.cosmetics === "object" ? u.cosmetics : {};
        const dia = Array.isArray(c.dia) ? c.dia : [];
        const badges = [];
        for (const b of Array.isArray(c.badges) ? c.badges : []) {
          const m = typeof b === "string" && b.match(/^(streak|listener|party|creator)_([1-4])$/);
          if (m && !badges.some((x) => x.id === m[1])) badges.push({ id: m[1], tier: Number(m[2]) });
        }
        return {
          ring: RINGS.includes(c.ring) ? c.ring : "none",
          banner: BANNER_FX.includes(c.banner) ? c.banner : "none",
          name: NAME_FX.includes(c.name) ? c.name : "none",
          dia: { ring: dia.includes("ring"), banner: dia.includes("banner"), name: dia.includes("name") },
          badges: badges.slice(0, 3),
        };
      }
      function bannerFxHtml(fx, dia) {
        if (fx === "none") return "";
        const spots = Array.from({ length: 28 }, (_, i) => ({ i, x: `${(i * 37) % 100}%`, y: `${(i * 53) % 90}%` }));
        const colours = ["#ff2e88", "#ffd23f", "#22e4ff", "#9dff3c", "#a46bff"];
        let inner = "";
        if (fx === "eq") inner = Array.from({ length: 32 }, (_, i) => `<i style="--i:${i}"></i>`).join("");
        else if (fx === "stars") inner = spots.map((s) => `<i style="--i:${s.i};--x:${s.x};--y:${s.y}"></i>`).join("");
        else if (fx === "embers") inner = spots.slice(0, 18).map((s) => `<i style="--i:${s.i};--x:${s.x}"></i>`).join("");
        else if (fx === "confetti") inner = spots.slice(0, 22).map((s) => `<i style="--i:${s.i};--x:${s.x};--c:${colours[s.i % 5]}"></i>`).join("");
        else if (fx === "waves")
          inner =
            '<svg viewBox="0 0 1200 100" preserveAspectRatio="none"><path d="M0 60 Q 75 20 150 60 T 300 60 T 450 60 T 600 60 T 750 60 T 900 60 T 1050 60 T 1200 60 V100 H0Z"/></svg>' +
            '<svg viewBox="0 0 1200 100" preserveAspectRatio="none"><path d="M0 50 Q 100 85 200 50 T 400 50 T 600 50 T 800 50 T 1000 50 T 1200 50 V100 H0Z"/></svg>';
        if (dia) inner += `<span class="dust">${Array.from({ length: 12 }, (_, i) => `<i style="--i:${i};--x:${(i * 29 + 7) % 96}%;--y:${(i * 41 + 11) % 86}%"></i>`).join("")}</span>`;
        return `<div class="fx-banner b-${fx}${dia ? " dia" : ""}" aria-hidden="true">${inner}</div>`;
      }

      // The featured song: a record half out of its sleeve (no audio, just what it is).
      function featuredHtml(u) {
        if (!u.song_title) return "";
        const art = pic(u.song_art_path);
        const img = art ? `<img src="${art}" alt="">` : "";
        return `<div class="feat">
          <span class="feat-rec" aria-hidden="true"><span class="feat-disc"><span class="feat-label">${img}</span></span><span class="feat-sleeve">${img || "&#9834;"}</span></span>
          <span class="feat-words"><small>&#10022; Featured</small><b>${esc(u.song_title)}</b><span>${esc(u.song_artist || "Unknown artist")}</span></span>
        </div>`;
      }

      async function profile(handle) {
        const u = await rpc("public_profile", { h: handle }).catch(() => null);
        if (!u) return notFound("No one has that username");
        const name = u.display_name || "@" + u.handle;
        const av = pic(u.avatar_path);
        const banner = pic(u.banner_path);
        const hours = u.minutes ? Math.round(u.minutes / 60) : 0;
        const fx = fxOf(u);
        const tint = /^#[0-9a-fA-F]{6}$/.test(u.accent || "") ? u.accent : "#ff2e88";
        const chips = [
          u.level > 1 ? `<span class="chip lvl">Lv ${Number(u.level) || 1}</span>` : "",
          u.streak > 0 ? `<span class="chip fire">${FLAME} ${Number(u.streak) || 0}</span>` : "",
          ...fx.badges.map((b) => `<span class="chip badge" style="--tc:${TIER_COLOURS[b.tier - 1]}">${BADGE_INFO[b.id][0]} ${TIER_NAMES[b.tier - 1]} ${BADGE_INFO[b.id][1]}</span>`),
        ].join("");
        document.documentElement.style.setProperty("--accent", u.accent || "#ff2e88");
        show(
          `<div class="card">
             <div class="banner" style="--rc:${tint}${banner ? `;background-image:url('${banner}')` : ""}">${bannerFxHtml(fx.banner, fx.dia.banner)}</div>
             <div class="body">
               <div class="fx-ring ringwrap r-${fx.ring}${fx.dia.ring && fx.ring !== "none" ? " dia" : ""}" style="--rc:${tint};--gap:0px;--rw:5px"><div class="avatar">${av ? `<img src="${av}" alt="">` : initial(name)}</div>${fx.dia.ring && fx.ring !== "none" ? '<span class="glints"><i></i><i></i><i></i><i></i></span>' : ""}</div>
               <h1><span class="fx-name n-${fx.name}${fx.dia.name ? " dia" : ""}" style="--rc:${tint}">${esc(name)}</span>${u.badge === "developer" ? ' <span class="dev-badge" title="Tune! developer">Developer</span>' : ""}</h1>
               <p class="handle">@${esc(u.handle)}</p>
               ${chips ? `<div class="chips">${chips}</div>` : ""}
               ${u.bio ? `<p class="bio">${esc(u.bio)}</p>` : ""}
               <div class="stats">
                 <span><b id="followers">${u.followers}</b>followers</span>
                 <span><b>${u.following}</b>following</span>
                 ${hours ? `<span><b>${hours}</b>hours this year</span>` : ""}
               </div>
               ${linksHtml(u.links)}
               ${featuredHtml(u)}
               ${u.top_artist ? `<p class="hint">Top artist this year: <strong>${esc(u.top_artist)}</strong></p>` : ""}
               <div class="actions">
                 <span id="follow-slot" hidden></span>
                 <button class="btn" id="go">Open in Tune!</button>
                 <a class="btn ghost" href="/">Download Tune!</a>
               </div>
               <p class="hint" id="hint"></p>
             </div>
           </div>`,
          `${name} (@${u.handle})`,
        );
        document.getElementById("go").addEventListener("click", () => openInApp(`tune://u/${u.handle}`));
        // Signed in on the website: the module below adds a Follow button.
        window.tuneProfile = { handle: u.handle, followers: u.followers };
        dispatchEvent(new Event("tune:profile"));
        // Straight into the app, unless you came here from the website itself (searching people).
        if (!document.referrer.startsWith(location.origin)) openInApp(`tune://u/${u.handle}`);
      }

      let m;
      if ((m = path.match(/^\/join\/([A-Za-z0-9]{6})$/))) party(m[1].toUpperCase());
      else if ((m = path.match(/^\/u\/([A-Za-z0-9._]{3,20})$/))) profile(m[1].toLowerCase());
      else notFound("This page doesn't exist");
    </script>
    <script type="module">
      import { api, whoami, href } from "/js/tune.js?v=3";

      // Follow and unfollow from a profile page, when you're signed in on the website.
      async function addFollow() {
        const shown = window.tuneProfile;
        const slot = document.getElementById("follow-slot");
        if (!shown || !slot) return;
        const me = await whoami();
        if (!me?.profile) return;
        if (me.profile.handle === shown.handle) {
          slot.outerHTML = `<a class="btn ghost" href="${href("/account")}">Edit your profile</a>`;
          return;
        }
        const them = await api.byHandle(shown.handle).catch(() => null);
        if (!them) return;
        let on = await api.isFollowing(me.user.id, them.id).catch(() => false);
        let count = shown.followers;
        slot.outerHTML = `<button class="btn" id="follow" aria-pressed="false"></button>`;
        const btn = document.getElementById("follow");
        const draw = () => {
          btn.textContent = on ? "Following" : "Follow";
          btn.classList.toggle("ghost", on);
          btn.setAttribute("aria-pressed", String(on));
          document.getElementById("followers").textContent = count;
        };
        // Following is the main thing here; opening the app becomes the second choice.
        document.getElementById("go")?.classList.add("ghost");
        draw();
        btn.addEventListener("click", async () => {
          const was = on;
          on = !on;
          count += on ? 1 : -1;
          draw();
          try {
            await (was ? api.unfollow(me.user.id, them.id) : api.follow(me.user.id, them.id));
          } catch (x) {
            on = was;
            count += was ? 1 : -1;
            draw();
            document.getElementById("hint").textContent = x.message;
          }
        });
      }
      if (window.tuneProfile) addFollow();
      else addEventListener("tune:profile", addFollow, { once: true });
    </script>
  </body>
</html>
